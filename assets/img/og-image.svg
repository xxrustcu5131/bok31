<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#06060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7d7d86"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9a9aa3"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="600" ry="300" fill="url(#glow)"/>

  <!-- Logo card on left -->
  <g transform="translate(120 175)">
    <rect x="0" y="0" width="280" height="280" rx="60"
          fill="#ffffff" fill-opacity="0.04"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Crosshair lines (drawn first, so dot covers center) -->
    <g stroke="url(#mark)" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="140" y1="35"  x2="140" y2="68"  stroke="#ffffff"/>
      <line x1="140" y1="212" x2="140" y2="245" stroke="#ffffff"/>
      <line x1="35"  y1="140" x2="68"  y2="140" stroke="#ffffff"/>
      <line x1="212" y1="140" x2="245" y2="140" stroke="#ffffff"/>
      <circle cx="140" cy="140" r="70" stroke="url(#mark)"/>
    </g>
    <circle cx="140" cy="140" r="14" fill="url(#mark)"/>
  </g>

  <!-- Brand text on right -->
  <g transform="translate(470 200)">
    <text x="0" y="118"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="124" font-weight="800" letter-spacing="-4" fill="url(#text)">FlyCheats</text>
    <text x="6" y="178"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="30" font-weight="500" fill="#9a9aa3">Premium Game Cheats Archive</text>

    <!-- Badge: games -->
    <g transform="translate(6 220)">
      <rect x="0" y="0" width="270" height="50" rx="25"
            fill="#ffffff" fill-opacity="0.05"
            stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="24" y="32"
            font-family="Inter, system-ui, sans-serif"
            font-size="18" font-weight="600" fill="#e8e8ec">CS2  ·  Rust  ·  Valorant</text>
    </g>
    <!-- Badge: undetected -->
    <g transform="translate(294 220)">
      <rect x="0" y="0" width="280" height="50" rx="25"
            fill="#22c55e" fill-opacity="0.12"
            stroke="#22c55e" stroke-opacity="0.45"/>
      <circle cx="26" cy="25" r="6" fill="#22c55e"/>
      <text x="44" y="32"
            font-family="Inter, system-ui, sans-serif"
            font-size="18" font-weight="600" fill="#a9eebf">Undetected &amp; Updated</text>
    </g>
  </g>

  <text x="600" y="585" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="16" font-weight="700" letter-spacing="6" fill="#5a5a63">FLYCHEATS.ORG</text>
</svg>
